spring.application.name=quickkart-backend
server.port=8081
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quickkart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Development Admin Account Configuration
app.dev-admin.enabled=${DEV_ADMIN_ENABLED:false}
app.dev-admin.name=${DEV_ADMIN_NAME:QuickKart Admin}
app.dev-admin.email=${DEV_ADMIN_EMAIL:admin@quickkart.com}
app.dev-admin.password=${DEV_ADMIN_PASSWORD:}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=${CACHE_TTL:300000}
spring.cache.redis.cache-null-values=false

# Logging & Correlation ID Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-N/A}] %-5level %logger{36} - %msg%n
logging.level.com.quickkart=INFO

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.health.db.enabled=true
management.health.redis.enabled=true

# Apache Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.order-events=${KAFKA_TOPIC_ORDER_EVENTS:quickkart.order-events}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:quickkart-order-notifications}
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.embedded.enabled=${KAFKA_EMBEDDED_ENABLED:true}





app.dev-products.enabled=${DEV_PRODUCTS_ENABLED:false}
app.dev-tools.enabled=${DEV_TOOLS_ENABLED:false}
otp.secret=${OTP_HASH_SECRET}

# Downstream services probed by the admin System Status page (/api/admin/system/status)
app.services.product-url=${PRODUCT_SERVICE_URL:http://localhost:8082}
app.services.order-url=${ORDER_SERVICE_URL:http://localhost:8083}
