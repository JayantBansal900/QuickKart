# Monolith Production Profile
management.endpoint.health.show-details=when-authorized
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
app.dev-admin.enabled=false
logging.level.com.quickkart=INFO
logging.level.org.springframework.security=WARN

app.dev-tools.enabled=false
app.kafka.embedded.enabled=false

spring.mail.host=${SMTP_HOST}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.from=${SMTP_FROM}

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Only health is remotely exposed; ignore untrusted forwarded headers.
management.endpoints.web.exposure.include=health
server.forward-headers-strategy=none
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
# Production always sends real email; console OTP delivery is impossible here.
app.mail.transport=smtp
