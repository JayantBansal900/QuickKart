# Test datasource is forcibly overridden by IsolatedDatabaseContextCustomizerFactory.
spring.datasource.url=jdbc:h2:mem:quickkart_test;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.profiles.active=test
app.dev-admin.enabled=false
app.dev-products.enabled=false
app.dev-tools.enabled=false
app.kafka.embedded.enabled=false
spring.kafka.listener.auto-startup=false
spring.kafka.admin.auto-create=false
# The outbox relay is exercised explicitly by OutboxIntegrationTest; keep it off elsewhere.
app.outbox.relay.enabled=false
