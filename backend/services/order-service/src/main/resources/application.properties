spring.application.name=order-service
server.port=8083
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quickkart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Apache Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
app.kafka.topics.order-events=${KAFKA_TOPIC_ORDER_EVENTS:quickkart.order-events}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:quickkart-order-notifications}
spring.kafka.consumer.auto-offset-reset=earliest
app.kafka.embedded.enabled=${KAFKA_EMBEDDED_ENABLED:true}

# Logging & Correlation ID Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-N/A}] %-5level %logger{36} - %msg%n
logging.level.com.quickkart.order=INFO

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.health.db.enabled=true
management.health.redis.enabled=true

app.dev-tools.enabled=${DEV_TOOLS_ENABLED:false}

# Simulated UPI/card gateway (the shopper chooses success or failure). Demo only: the prod
# profile forces it off, because it would let anyone mark an order as paid.
app.payments.simulated-online.enabled=${SIMULATED_ONLINE_PAYMENTS:true}
