spring.application.name=product-service
server.port=8082
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/quickkart}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=${CACHE_TTL:300000}
spring.cache.redis.cache-null-values=false

# Logging & Correlation ID Pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId:-N/A}] %-5level %logger{36} - %msg%n
logging.level.com.quickkart.product=INFO

# Spring Boot Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.health.db.enabled=true
management.health.redis.enabled=true

app.dev-products.enabled=${DEV_PRODUCTS_ENABLED:false}
app.dev-tools.enabled=${DEV_TOOLS_ENABLED:false}

# Admin product photo uploads (stored on disk; a Docker volume in Compose)
app.uploads.dir=${APP_UPLOADS_DIR:./uploads}
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# Catalog cache (see ProductService). Search pages may be at most this stale when stock is changed
# by order-service; checkout always re-validates stock under a row lock, so this cannot oversell.
app.cache.search-ttl-seconds=${CATALOG_SEARCH_CACHE_TTL_SECONDS:60}
app.cache.category-ttl-seconds=${CATALOG_CATEGORY_CACHE_TTL_SECONDS:300}
