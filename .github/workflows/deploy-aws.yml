name: AWS deployment approval boundary
on: workflow_dispatch
permissions:
  contents: read
jobs:
  approval-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: No configured AWS deployment target
        run: |
          echo "AWS deployment is not configured or verified. The app runs locally with Docker Compose; see docs/development.md."
          echo "This workflow intentionally fails rather than reporting an unperformed deployment as successful."
          exit 1
