name: AWS deployment approval boundary
on: workflow_dispatch
permissions:
  contents: read
jobs:
  approval-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: No configured AWS deployment target
        run: |
          echo "AWS deployment is not configured or verified. Follow docs/engineering/phase-5-deployment.md."
          echo "This workflow intentionally fails rather than reporting an unperformed deployment as successful."
          exit 1
