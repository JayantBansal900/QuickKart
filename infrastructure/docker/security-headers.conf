# Included in every location that sends a response from nginx itself. (nginx drops server-level
# add_header directives inside any location that has its own add_header, so they are repeated here.)
#
# CSP: scripts and API calls only from this origin (the theme script is a file, not inline);
# Google Fonts for the typefaces; images may also come from https URLs set by admins
# (category images). 'unsafe-inline' is limited to styles (React style attributes).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
