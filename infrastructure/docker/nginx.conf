server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    include /etc/nginx/snippets/security-headers.conf;

    # Caching strategy for the Vite build:
    #  - index.html is the entry point and is NOT fingerprinted, so browsers must re-check it on every
    #    visit ("no-cache" = may store, but must revalidate). Otherwise users keep running an old
    #    release after a deploy until they hard-reload.
    #  - /assets/* files have a content hash in their names (index-CsvfxuTe.js); a new build gets new
    #    names, so these can be cached for a year and never re-downloaded.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
    }

    location /assets/ {
        # No "always": a 404 must not be cached for a year (e.g. during a deploy).
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # Catalog photos and category tiles keep their URL when replaced, so cache them for a day and
    # then revalidate (cheap: nginx answers 304 via ETag) instead of showing an old picture forever.
    location ~* ^/(products|categories)/.+\.(webp|jpg|jpeg|png|svg)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # SPA routes (/, /products/12, /admin/orders...) all serve index.html, which gets the
    # no-cache header from the exact-match location above via the internal redirect.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 4m; # admin product photos are up to 3 MB
        proxy_pass http://api-gateway:8080/api/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://api-gateway:8080/actuator/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

}
